name: JUN-1376 Android acceptance runtime
on:
  push:
    branches: [codex/jun-1376-android-acceptance]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EMULATOR_IMAGE: system-images;android-35;google_apis;x86_64
      EXPECTED_MARKET_CID: bafkreidgdqlqt4kg2whsjchsbn7hkolcn3zrndn4wbzgk5uytnabsvz3hq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify built APK and start Android emulator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p acceptance
          gh run download 44451044141 -n jun-1376-market-android-x86_64 -D acceptance
          (cd acceptance && sha256sum -c SHA256SUMS)
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          export JAVA_HOME="${JAVA_HOME_21_X64:?}"
          manager=$(find "${ANDROID_HOME:?}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort | tail -1)
          export PATH="$JAVA_HOME/bin:$(dirname "$manager"):$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager platform-tools emulator "$EMULATOR_IMAGE"
          command -v adb
          echo no | avdmanager create avd --force --name market-ci --package "$EMULATOR_IMAGE"
          emulator -avd market-ci -port 5560 -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect > acceptance/emulator.log 2>&1 &
          if ! timeout 180 adb -s emulator-5560 wait-for-device; then
            tail -60 acceptance/emulator.log
            exit 1
          fi
          for check in $(seq 1 90); do
            if [ "$(adb -s emulator-5560 shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then break; fi
            sleep 2
          done
          test "$(adb -s emulator-5560 shell getprop sys.boot_completed | tr -d '\r')" = 1
          python3 scripts/jun-1376-android-acceptance.py | tee acceptance/android-live.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: jun-1376-android-runtime
          path: acceptance
          retention-days: 7
